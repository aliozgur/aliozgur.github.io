<head>
    <!-- Theme: apply stored or system preference before first paint -->
    <script>
    (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.head_title | default: page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    {% include meta.html %}
    {% include adsense-head.html %}

    <!-- Start fetching the header image before CSS/layout so it paints with the page -->
    <link rel="preload" as="image" href="{{ site.baseurl }}/{{ page.header-img | default: site.header-img }}">

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Bootstrap Core CSS -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "/css/clean-blog.css" | prepend: site.baseurl }}">

    <!-- Pygments Github CSS -->
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <!-- Search -->
    <link rel="stylesheet" href="{{ "/css/search.css" | prepend: site.baseurl }}">
    <script src="{{ "/js/lunr.min.js" | prepend: site.baseurl }}" defer></script>
    <script src="{{ "/js/search.js" | prepend: site.baseurl }}" defer></script>

    <!-- Compact header -->
    <link rel="stylesheet" href="{{ "/css/header.css" | prepend: site.baseurl }}">

    <!-- Theme (light / dark) -->
    <link rel="stylesheet" href="{{ "/css/theme.css" | prepend: site.baseurl }}">
    <script src="{{ "/js/theme.js" | prepend: site.baseurl }}" defer></script>

    <!-- Content-width header card + solid navbar (remove to restore full-width header) -->
    <link rel="stylesheet" href="{{ "/css/header-card.css" | prepend: site.baseurl }}">

    <!-- Reading typography (post body, home post list) -->
    <link rel="stylesheet" href="{{ "/css/typography.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <link href="//maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link href='//fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,700&display=swap' rel='stylesheet' type='text/css'>
    <link href='//fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800' rel='stylesheet' type='text/css'>

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    
</head>
