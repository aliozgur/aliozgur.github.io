name: Build and deploy Jekyll site to GitHub Pages

on:
  # Rebuild whenever content is pushed to master, same as today.
  push:
    branches: ["master"]

  # Rebuild every day so future-dated posts (date: in front matter) go live
  # automatically once their date arrives, without needing a new commit.
  # Jekyll's default `future: false` keeps them hidden from the build until then.
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily -> 06:00 Europe/Istanbul

  # Allows triggering a rebuild manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys; let the latest one win.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
